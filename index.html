<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>😉</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#f3f3f3;background:linear-gradient(145deg,#202326 0%,#111315 48%,#050506 100%);display:flex;justify-content:center;align-items:center;overflow-x:hidden}.screen{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}button{border:1px solid rgba(255,255,255,.25);color:#eee;background:rgba(255,255,255,.07);padding:15px 38px;font-size:15px;letter-spacing:3px;border-radius:8px;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.content{animation:fadeIn 1.1s ease both;text-align:center;display:flex;flex-direction:column;gap:25px;align-items:center}#message{font-size:clamp(20px,5vw,30px);font-weight:400;letter-spacing:.3px;line-height:1.5}img{display:block;width:min(88vw,430px);max-height:72vh;object-fit:contain;border-radius:10px;box-shadow:0 15px 40px rgba(0,0,0,.35)}@media(prefers-reduced-motion:reduce){.content{animation:none}}</style></head><body><main class="screen"><div class="content"><a href="reveal.html" style="text-decoration:none"><button type="button">CLICK</button></a></div></main></body></html>
